name: CI
run-name: Running continuous integration on ${{ github.actor }}'s commits

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backendTest:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@8601c1c7d28289879772574a60fe817fb953eeee # 1.0.93
        with:
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}
          INSTALL_GO: true

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Run pre-test checks
        uses: ./.github/composite/pretest

      - name: Run tests
        uses: ./.github/composite/test

  buildImage:
    name: Build ${{ github.event_name == 'pull_request' && 'staging' || 'production' }} image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [backendTest]

    if: >-
      github.ref_name == 'main' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@8601c1c7d28289879772574a60fe817fb953eeee # 1.0.93
        with:
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}
          INSTALL_GO: true

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Build image
        uses: ./.github/composite/build-image
        with:
          ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_ID: ${{ github.event.pull_request.number }}
          ARCH: ${{ matrix.arch }}

  deployStaging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [buildImage]

    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@8601c1c7d28289879772574a60fe817fb953eeee # 1.0.93
        with:
          SECRETS: ${{ toJSON(secrets) }}

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Deploy client
        uses: ./.github/composite/deploy
        with:
          ENVIRONMENT: staging
          SHA: ${{ github.event.pull_request.head.sha }}

  createTag:
    name: Create new tag
    runs-on: ubuntu-latest
    needs: [buildImage]

    if: github.ref_name == 'main'

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@8601c1c7d28289879772574a60fe817fb953eeee # 1.0.93
        with:
          SECRETS: ${{ toJSON(secrets) }}

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Create new tag
        uses: ./.github/composite/create-tag
